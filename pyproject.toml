[project]
name = "vectorgraphicseditor"
version = "0.1.0"
description = "A simple vector graphics editor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["PyQt5==5.15.11"]

[project.scripts]
editor = "graphicseditor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/*.py", "/images/"]
